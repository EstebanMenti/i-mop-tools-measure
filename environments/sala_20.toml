# =============================================================================
# environments/sala_20.toml — Ambiente "Sala 20"
# =============================================================================
# ÚNICA fuente de verdad para las anclas UWB de este ambiente.
# Reemplaza la sección [anchors] del layout monolítico previo (MAC corta)
# y los [nodos] de la vieja sala_20.toml, unificando el formato a MAC BLE.
#
# Cada ancla define: nombre, MAC BLE, posición [x,y,z] y tiempo de prendido.
# =============================================================================

[sala]
# Identificador de sala (debe coincidir con el nombre del archivo)
id = "20"
# Nombre descriptivo (opcional, para documentación)
nombre = "Sala 20 - Configuración Real"

# Dimensiones del espacio (para plotting/trilateración)
[dimensions]
x = 6.0   # metros
y = 8.0
z = 3.0

# ---------------------------------------------------------------------------
# Anclas UWB
# ---------------------------------------------------------------------------
# Dos direcciones por nodo (espacios distintos, no derivables):
#   mac      -> MAC BLE completa (AA:BB:CC:DD:EE:FF), para encendido/apagado BLE.
#   uwb_addr -> dirección corta UWB de 2 bytes (XX:YY), para la sesión de
#               ranging y el matcheo de notificaciones RangingData.
# config.anchors se keyea por uwb_addr. Ajusta AMBOS campos a los reales.
# Formato de tiempo: número + sufijo (s = segundos, m = minutos)
# ---------------------------------------------------------------------------

#[[anchors]]
#key             = "uwb_node_1"
#nombre          = "UWB-Node-1"
#mac             = "EE:5E:3F:A2:1A:88"
#uwb_addr        = "00:01"               # TODO: short address UWB real del nodo 1
#posicion        = [0.00, 0.00, 0.0]    # TODO: posicion real del nodo 1
#tiempo_prendido = "120s"

