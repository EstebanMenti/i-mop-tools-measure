# =============================================================================
# environments/sala_20.toml — Ambiente "Sala 20"
# =============================================================================
# ÚNICA fuente de verdad para las anclas UWB de este ambiente.
# Reemplaza la sección [anchors] del layout monolítico previo (MAC corta)
# y los [nodos] de la vieja sala_20.toml, unificando el formato a MAC BLE.
#
# Cada ancla define: nombre, MAC BLE, posición [x,y,z] y tiempo de prendido.
# =============================================================================

[sala]
# Identificador de sala (debe coincidir con el nombre del archivo)
id = "20"
# Nombre descriptivo (opcional, para documentación)
nombre = "Sala 20 - Configuración Real"

# Dimensiones del espacio (para plotting/trilateración)
[dimensions]
x = 6.0   # metros
y = 8.0
z = 3.0

# ---------------------------------------------------------------------------
# Anclas UWB
# ---------------------------------------------------------------------------
# Dos direcciones por nodo (espacios distintos, no derivables):
#   mac      -> MAC BLE completa (AA:BB:CC:DD:EE:FF), para encendido/apagado BLE.
#   uwb_addr -> dirección corta UWB de 2 bytes (XX:YY), para la sesión de
#               ranging y el matcheo de notificaciones RangingData.
# config.anchors se keyea por uwb_addr. Ajusta AMBOS campos a los reales.
# Formato de tiempo: número + sufijo (s = segundos, m = minutos)
# ---------------------------------------------------------------------------

[[anchors]]
key             = "uwb_node_10"
nombre          = "UWB-Node-10"
mac             = "FD:7A:90:57:CC:9F"
uwb_addr        = "00:01"               # TODO: short address UWB real del nodo 10
posicion        = [0.0, 0.0, 0.85]      # TODO: posicion real del nodo 10
tiempo_prendido = "120s"

[[anchors]]
key             = "uwb_node_11"
nombre          = "UWB-Node-11"
mac             = "E5:A2:2C:DB:14:B9"
uwb_addr        = "00:02"               # TODO: short address UWB real del nodo 11
posicion        = [0.03, 0.03, 0.26]    # TODO: posicion real del nodo 11
tiempo_prendido = "120s"

[[anchors]]
key             = "uwb_node_1"
nombre          = "UWB-Node-1"
mac             = "EE:5E:3F:A2:1A:88"
uwb_addr        = "00:03"               # TODO: short address UWB real del nodo 1
posicion        = [0.03, 1.03, 0.26]    # TODO: posicion real del nodo 1
tiempo_prendido = "120s"


# ---------------------------------------------------------------------------
# Timeouts BLE para esta sala (opcional - se usan defaults si se omite)
# ---------------------------------------------------------------------------
[ble_timeouts]
# Segundos TOTALES para conectar a cada nodo, incluyendo reintentos (Bleak/BlueZ)
connection_timeout = 180.0
# Segundos de espera de ACK al mandar "uwb on"/"uwb off"
command_timeout = 5.0
# Espera fija tras conectar, antes de chequear el MTU negociado
mtu_negotiation_wait = 5.0
# Segundos entre reintentos de negociación de MTU
mtu_retry_wait = 2.0
# Cantidad de intentos de negociación de MTU
mtu_retry_attempts = 3
# Margen fijo para esperar que el apagado + desconexión de TODOS los nodos termine
session_end_timeout = 15.0
# Segundos para reconectar a cada nodo al apagar
power_off_connection_timeout = 20.0
# Cuántos nodos conectar/prender/apagar EN SIMULTÁNEO (límite duro Pi ~7)
max_concurrent_connections = 5
# Patrulla round-robin de monitoreo (batería + qorvo STAT) por nodo, en segundos.
# 0 desactiva el monitoreo.
monitor_interval = 60.0
# Timeout de respuesta completa de los comandos `qorvo <cmd>` (>= límite duro de 8s del puente)
qorvo_command_timeout = 10.0
